# Docs for the Azure Web Apps Deploy action:
# https://github.com/Azure/webapps-deploy

name: Build and deploy Node.js app to Azure Web App - travelcompanion

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # Install backend dependencies
      - name: Install dependencies
        working-directory: backend
        run: npm install

      # Run build if present
      - name: Build project
        working-directory: backend
        run: npm run build --if-present

      # Run tests if present
      - name: Run tests
        working-directory: backend
        run: npm test --if-present

      # Upload backend only
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: backend

  deploy:
    runs-on: ubuntu-latest

    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      # Download artifact
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      # Login to Azure
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_805E7650B1A84AA987FD6E57CB31BA7C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E36973A1D5854FB4AE93B5ACEF24B950 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_CDBAD3EC82EC43E4B0DC99F13DB87FE0 }}

      # Deploy backend
      - name: Deploy to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: travelcompanion
          slot-name: Production
          package: .
